<script>
let player = "";
let data = JSON.parse(localStorage.getItem("ska_data")) || {
 xp: 0,
 coins: 0,
 lessonDone: []
};

function saveData(){
 localStorage.setItem("ska_data",JSON.stringify(data));
}

function safe(text){
 return String(text).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function greeting(){
 const name=player.toLowerCase();

 if(name==="haura"){
  return "Halo cantik ini cuman uji coba tugas maaf kalo gari dan membosan kan yaaa love youuu";
 }

 if(name==="azkara"){
  return "Halo boy kamu adalah owner semangat ujian nya ya";
 }

 return "Selamat datang di Smart Kids Adventure! Siap belajar dan bermain hari ini?";
}

function playSound(){
 if(!("speechSynthesis" in window)) return;

 const name=player.toLowerCase();

 if(name!=="haura" && name!=="azkara") return;

 const message=greeting();

 const voices=window.speechSynthesis.getVoices();
 const indo=voices.filter(v=>v.lang.toLowerCase().includes("id"));

 let voice=null;

 if(name==="haura"){
  voice=indo.find(v=>/female|woman|perempuan/i.test(v.name));
 }else{
  voice=indo.find(v=>/male|man|laki/i.test(v.name));
 }

 if(!voice) voice=indo[0] || voices[0];

 // Efek elektronik pembuka
 try{
  const AudioCtx=window.AudioContext || window.webkitAudioContext;
  if(AudioCtx){
   const ctx=new AudioCtx();
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();

   osc.type="sine";
   osc.frequency.setValueAtTime(660,ctx.currentTime);
   osc.frequency.exponentialRampToValueAtTime(330,ctx.currentTime+0.35);

   gain.gain.setValueAtTime(0.12,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);

   osc.connect(gain);
   gain.connect(ctx.destination);

   osc.start();
   osc.stop(ctx.currentTime+0.4);
  }
 }catch(e){}

 const utterance=new SpeechSynthesisUtterance(message);
 utterance.lang="id-ID";
 utterance.rate=name==="haura"?0.9:0.82;
 utterance.pitch=name==="haura"?1.15:0.75;
 utterance.volume=1;

 if(voice) utterance.voice=voice;

 setTimeout(()=>{
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
 },450);
}

function login(){
 const input=document.getElementById("playerName");
 const warning=document.getElementById("loginWarning");

 player=input.value.trim();

 if(!player){
  warning.textContent="MASUKKAN NAMA PEMAIN TERLEBIH DAHULU!";
  return;
 }

 localStorage.setItem("ska_player",player);

 playSound();
 showDashboard();
}

 document.getElementById("homePage").style.display="block";
 renderTab("home");
}

   </div>`;

    GANTI PEMAIN

   <div class="status">PLAYER STATUS<br>ACTIVE ●</div>
  </div>

  <div class="profile">
   <div class="avatar">🎭</div>
   <div class="profile-info">
    <small>PLAYER PROFILE</small>
    <b>${safe(player.toUpperCase())}</b>
   </div>
   <span style="color:#00dfa0">●</span>
  </div>

  <div class="navbar">
   <button class="nav-btn ${tab==="home"?"active":""}" onclick="renderTab('home')">⌂ BERANDA</button>
   <button class="nav-btn ${tab==="mission"?"active":""}" onclick="renderTab('mission')">△ MISI</button>
   <button class="nav-btn ${tab==="profile"?"active":""}" onclick="renderTab('profile')">□ PROFIL</button>
  </div>

  ${content}

  <footer>
   SMART KIDS ADVENTURE
   <b>CREATED BY MOH NATHAN ALMUSTAF</b>
  </footer>
 `;
}

  data.lessonDone.push(id);
  saveData();

 }
 renderLearning();

  content=`

    </button>
   </div>`;
 }else if(selectedSubject){
  const subject=subjectData.find(item=>item.id===selectedSubject);
  const lessons=lessonData.filter(item=>item.subject===selectedSubject);

  content=`
   <h2>△ ${subject.name}</h2>
   <p>Pilih materi yang ingin kamu pelajari.</p>
   <button class="back-btn" onclick="backToSubjects()">← SEMUA PELAJARAN</button>

   ${lessons.map(item=>`
    <div class="lesson-card">
     <h3>${item.title}</h3>
     <p>${data.lessonDone.includes(item.id)?"✓ SUDAH SELESAI":"BELUM DIPELAJARI"}</p>
     <button class="learn-btn" onclick="openLesson('${item.id}')">
      BUKA MATERI
     </button>
    </div>
   `).join("")}`;
 }else{
  content=`
   <h2>○ LEARNING ARENA</h2>
   <p>Pilih mata pelajaran untuk memulai petualangan belajar!</p>
   <div class="subject-grid">
    ${subjectData.map(item=>`
     <button class="subject-card" onclick="showSubject('${item.id}')">
      <span style="font-size:27px">${item.icon}</span>
      <b>${item.name}</b>
      <small>${item.desc}</small>
     </button>
    `).join("")}
   </div>`;
 }

 document.getElementById("dashboard").innerHTML=`
  <div class="topbar">
   <h2>SMART <span>KIDS</span></h2>
   <div class="status">PLAYER STATUS<br>ACTIVE ●</div>
  </div>

  <div class="profile">
   <div class="avatar">🎭</div>
   <div class="profile-info">
    <small>PLAYER PROFILE</small>
    <b>${safe(player.toUpperCase())}</b>
   </div>
   <span style="color:#00dfa0">●</span>
  </div>

  <div class="navbar">
   <button class="nav-btn" onclick="renderTab('home')">⌂ BERANDA</button>
   <button class="nav-btn active" onclick="renderTab('learn')">📚 BELAJAR</button>
   <button class="nav-btn" onclick="renderTab('mission')">△ MISI</button>
   <button class="nav-btn" onclick="renderTab('profile')">□ PROFIL</button>
  </div>

  ${content}

  <footer>
   SMART KIDS ADVENTURE
   <b>CREATED BY MOH NATHAN ALMUSTAF</b>
  </footer>
 `;
}

/* Menghubungkan menu belajar dengan Tahap 2 */

renderTab = function(tab){
 if(tab==="learn"){
  selectedSubject="";
  selectedLesson=null;
  renderLearning();
  return;
 }

 stage2RenderTab(tab);

 const nav=document.querySelector(".navbar");

 if(nav){
  nav.innerHTML=`
   <button class="nav-btn ${tab==="home"?"active":""}" onclick="renderTab('home')">⌂ BERANDA</button>
   <button class="nav-btn" onclick="renderTab('learn')">📚 BELAJAR</button>
   <button class="nav-btn ${tab==="mission"?"active":""}" onclick="renderTab('mission')">△ MISI</button>
   <button class="nav-btn ${tab==="profile"?"active":""}" onclick="renderTab('profile')">□ PROFIL</button>
  `;
 }
};
