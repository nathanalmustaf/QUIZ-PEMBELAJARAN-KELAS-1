// ========== MATERI DAN KUIS ==========

function openSubject(id){
 subject=subjects.find(s=>s.id===id);
 if(!subject)return;
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">${subject.icon}</div>
  <h2>${subject.name}</h2>
  <p>Yuk belajar dan kumpulkan bintang!</p>
 </div>
 <h2>📚 Materi Pembelajaran</h2>
 <div class="grid">
 ${subject.lessons.map((l,i)=>`
  <div class="card">
   <h3>📖 ${l[0]}</h3>
   <p>${l[1]}</p>
   <button class="btn light" onclick="readLesson(${i})">Pelajari</button>
  </div>`).join('')}
 </div>
 <div class="panel center">
  <h2>🎯 Siap Mengikuti Kuis?</h2>
  <p>15 soal akan diacak setiap permainan.</p>
  <button class="btn green" onclick="startQuiz()">Mulai Kuis 🚀</button>
 </div>`;
}
function readLesson(i){
 let l=subject.lessons[i];
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">${subject.icon}</div>
  <h2>${l[0]}</h2>
  <p style="font-size:18px;line-height:1.7">${l[1]}</p>
  <button class="btn green" onclick="openSubject('${subject.id}')">Selesai Belajar</button>
 </div>`;
}
function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function startQuiz(){
 quiz=shuffle(subject.questions).slice(0,15);
 qi=0;score=0;
 renderQuestion();
}
function renderQuestion(){
 if(qi>=quiz.length){finishQuiz();return;}
 let q=quiz[qi];
 let choices=q[1].map((v,i)=>({text:v,correct:i===q[2]}));
 choices=shuffle(choices);
 window.currentChoices=choices;
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel">
  <div class="top">
   <b>${subject.icon} ${subject.name}</b>
   <b>Soal ${qi+1}/15</b>
  </div>
  <div class="progress"><div style="width:${qi/15*100}%"></div></div>
  <h2 style="margin-top:25px">${q[0]}</h2>
  <div id="choices">
   ${choices.map((c,i)=>`
    <button class="option" onclick="answerQuestion(${i})">${['A','B','C','D'][i]}. ${c.text}</button>
   `).join('')}
  </div>
  <p id="feedback"></p>
 </div>`;
}
function answerQuestion(i){
 let choices=window.currentChoices;
 let buttons=document.querySelectorAll('.option');
 if(!buttons.length||buttons[0].disabled)return;
 buttons.forEach(b=>b.disabled=true);
 let correct=choices[i].correct;
 if(correct){
  score++;
  buttons[i].classList.add('correct');
  document.getElementById('feedback').textContent='🎉 Hebat! Jawabanmu benar!';
 }else{
  buttons[i].classList.add('wrong');
  let correctIndex=choices.findIndex(c=>c.correct);
  buttons[correctIndex].classList.add('correct');
  document.getElementById('feedback').textContent='🌱 Tidak apa-apa, ayo belajar lagi!';
 }
 let next=document.createElement('button');
 next.className='btn green';
 next.textContent=qi===14?'Lihat Hasil':'Soal Berikutnya →';
 next.onclick=()=>{qi++;renderQuestion();};
 document.getElementById('choices').appendChild(next);
}
function finishQuiz(){
 let earned=score*5;
 saved.completed++;
 daily().quiz++;
 daily().study+=5;
 reward(earned);
 saved.history.push({
  date:today(),subject:subject.name,score:score,total:15
 });
 save();
 document.getElementById('app').innerHTML=`
 <div class="panel center">
  <div class="big">${score>=12?'🏆':'🌟'}</div>
  <h2>Kuis Selesai!</h2>
  <h1>${score}/15</h1>
  <p>Jawaban benar dari 15 soal.</p>
  <p>⭐ ${earned} XP berhasil kamu dapatkan!</p>
  <button class="btn green" onclick="openSubject('${subject.id}')">Ulangi Kuis</button>
  <button class="btn light" onclick="home()">Kembali ke Beranda</button>
 </div>`;
}

// 1. SLIDING PUZZLE
let puzzleTiles=[];
let puzzleMoves=0;

function puzzleGame(){
 puzzleTiles=shuffle([1,2,3,4,5,6,7,8,0]);
 puzzleMoves=0;
 renderPuzzle();
}
function renderPuzzle(){
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">🧩</div>
  <h2>Sliding Puzzle</h2>
  <p>Susun angka dari 1 sampai 8. Kotak kosong ada di akhir.</p>
  <p>Langkah: <b>${puzzleMoves}</b></p>
  <div class="tilegrid">
   ${puzzleTiles.map((n,i)=>`
    <button class="tile ${n===0?'empty':''}" onclick="moveTile(${i})">${n||''}</button>
   `).join('')}
  </div>
  <button class="btn light" onclick="puzzleGame()">Acak Ulang</button>
 </div>`;
}
function moveTile(i){
 let empty=puzzleTiles.indexOf(0);
 let row=Math.floor(i/3),col=i%3;
 let er=Math.floor(empty/3),ec=empty%3;
 if(Math.abs(row-er)+Math.abs(col-ec)!==1)return;
 [puzzleTiles[i],puzzleTiles[empty]]=[puzzleTiles[empty],puzzleTiles[i]];
 puzzleMoves++;
 if(puzzleTiles.join(',')==='1,2,3,4,5,6,7,8,0'){
  reward(20);
  daily().play+=3;
  document.getElementById('app').innerHTML=`
  <div class="panel center">
   <div class="big">🏆</div>
   <h2>Berhasil!</h2>
   <p>Kamu berhasil menyusun puzzle dalam ${puzzleMoves} langkah!</p>
   <p>⭐ +20 XP</p>
   <button class="btn green" onclick="puzzleGame()">Main Lagi</button>
   <button class="btn light" onclick="home()">Beranda</button>
  </div>`;
  return;
 }
 renderPuzzle();
}

// 2. MEMORY MATCH
const memoryPictures=['🐱','🐶','🐰','🦊','🐼','🐸','🦁','🐵'];
function memoryGame(){
 memory=shuffle([...memoryPictures,...memoryPictures]).map((v,i)=>({
  id:i,value:v,open:false,matched:false
 }));
 opened=[];
 found=0;
 renderMemory();
}
function renderMemory(){
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">🧠</div>
  <h2>Memory Match</h2>
  <p>Temukan semua pasangan gambar yang sama!</p>
  <p>Pasangan ditemukan: ${found}/8</p>
  <div class="memorygrid">
   ${memory.map((m,i)=>`
    <button class="memory" onclick="flipMemory(${i})" ${m.open||m.matched?'disabled':''}>
     ${m.open||m.matched?m.value:'❔'}
    </button>
   `).join('')}
  </div>
  <button class="btn light" onclick="memoryGame()">Ulangi</button>
 </div>`;
}
function flipMemory(i){
 if(memory[i].open||memory[i].matched||opened.length>=2)return;
 memory[i].open=true;
 opened.push(i);
 renderMemory();
 if(opened.length===2){
  let [a,b]=opened;
  if(memory[a].value===memory[b].value){
   memory[a].matched=true;
   memory[b].matched=true;
   found++;
   opened=[];
   if(found===8){
    reward(30);
    daily().play+=4;
    setTimeout(()=>{
     document.getElementById('app').innerHTML=`
     <div class="panel center">
      <div class="big">🎉</div>
      <h2>Semua Pasangan Ditemukan!</h2>
      <p>Hebat sekali! Kamu mendapatkan 30 XP.</p>
      <button class="btn green" onclick="memoryGame()">Main Lagi</button>
      <button class="btn light" onclick="home()">Beranda</button>
     </div>`;
    },400);
   }
  }else{
   setTimeout(()=>{
    memory[a].open=false;
    memory[b].open=false;
    opened=[];
    renderMemory();
   },850);
  }
 }
}

// 3. MATH CHALLENGE
function mathGame(){
 mathRound=0;
 mathScore=0;
 nextMath();
}
function nextMath(){
 if(mathRound>=10){
  reward(mathScore*3);
  daily().play+=3;
  document.getElementById('app').innerHTML=`
   <div class="panel center">
    <div class="big">🔢</div>
    <h2>Tantangan Selesai!</h2>
    <h1>${mathScore}/10</h1>
    <p>Jawaban benar!</p>
    <p>⭐ Kamu mendapat ${mathScore*3} XP.</p>
    <button class="btn green" onclick="mathGame()">Main Lagi</button>
    <button class="btn light" onclick="home()">Beranda</button>
   </div>`;
  return;
 }
 let a=Math.floor(Math.random()*10)+1;
 let b=Math.floor(Math.random()*10)+1;
 let subtract=Math.random()>.5;
 if(subtract&&b>a)[a,b]=[b,a];
 mathAnswer=subtract?a-b:a+b;
 let symbol=subtract?'-':'+';
 let choices=shuffle([
  mathAnswer,
  mathAnswer+1,
  Math.max(0,mathAnswer-1),
  mathAnswer+2
 ]);
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">🔢</div>
  <h2>Math Challenge</h2>
  <p>Soal ${mathRound+1} dari 10</p>
  <h1 style="font-size:48px">${a} ${symbol} ${b} = ?</h1>
  ${choices.map(n=>`
   <button class="option center" onclick="checkMath(${n})">${n}</button>
  `).join('')}
  <p id="mathFeedback"></p>
 </div>`;
}
function checkMath(n){
 let buttons=document.querySelectorAll('.option');
 if(buttons[0]?.disabled)return;
 buttons.forEach(b=>b.disabled=true);
 if(n===mathAnswer){
  mathScore++;
  document.getElementById('mathFeedback').textContent='🎉 Benar! Hebat!';
 }else{
  document.getElementById('mathFeedback').textContent='🌱 Jawaban yang benar: '+mathAnswer;
 }
 let btn=document.createElement('button');
 btn.className='btn green';
 btn.textContent='Soal Berikutnya →';
 btn.onclick=()=>{mathRound++;nextMath();};
 document.querySelector('.panel').appendChild(btn);
}

// 5. COLORING STUDIO
let paintCanvas=null;
let paintCtx=null;
let painting=false;
let paintImage='🌻';

function colorGame(){
 document.getElementById('app').innerHTML=`
 ${back()}
 <div class="panel center">
  <div class="big">🖍️</div>
  <h2>Coloring Studio</h2>
  <p>Pilih warna dan warnai gambar sesukamu!</p>
  <div style="font-size:35px;margin:10px">
   <button class="btn light" onclick="choosePaintImage('🌻')">🌻</button>
   <button class="btn light" onclick="choosePaintImage('🏠')">🏠</button>
   <button class="btn light" onclick="choosePaintImage('🐱')">🐱</button>
   <button class="btn light" onclick="choosePaintImage('🌈')">🌈</button>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px">
   ${['#ff7777','#ffbd45','#ffe45e','#62c98b','#64b9ed','#a77bea','#ff85bd','#333333'].map(c=>`
    <button onclick="setPaintColor('${c}')" style="width:35px;height:35px;border-radius:50%;background:${c};border:2px solid #ddd"></button>
   `).join('')}
  </div>
  <canvas id="paintCanvas" width="600" height="400"></canvas>
  <p class="small">Gunakan jari untuk menggambar dan mewarnai.</p>
  <button class="btn orange" onclick="clearPaint()">Hapus Warna</button>
  <button class="btn green" onclick="savePainting()">Simpan Karya</button>
 </div>`;
 initPaint();
}
function initPaint(){
 paintCanvas=document.getElementById('paintCanvas');
 paintCtx=paintCanvas.getContext('2d');
 drawPaintBackground();
 paintCanvas.onpointerdown=e=>{
  painting=true;
  paintCanvas.setPointerCapture(e.pointerId);
  let p=getPaintPoint(e);
  paintCtx.beginPath();
  paintCtx.moveTo(p.x,p.y);
 };
 paintCanvas.onpointermove=e=>{
  if(!painting)return;
  let p=getPaintPoint(e);
  paintCtx.lineWidth=18;
  paintCtx.lineCap='round';
  paintCtx.strokeStyle=paintColor;
  paintCtx.lineTo(p.x,p.y);
  paintCtx.stroke();
 };
 paintCanvas.onpointerup=()=>painting=false;
 paintCanvas.onpointercancel=()=>painting=false;
}
function getPaintPoint(e){
 let r=paintCanvas.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*paintCanvas.width/r.width,
  y:(e.clientY-r.top)*paintCanvas.height/r.height
 };
}
function drawPaintBackground(){
 paintCtx.fillStyle='white';
 paintCtx.fillRect(0,0,600,400);
 paintCtx.font='180px Arial';
 paintCtx.textAlign='center';
 paintCtx.textBaseline='middle';
 paintCtx.fillStyle='#333';
 paintCtx.fillText(paintImage,300,200);
}
function setPaintColor(c){paintColor=c;}
function choosePaintImage(img){
 paintImage=img;
 drawPaintBackground();
}
function clearPaint(){drawPaintBackground();}
function savePainting(){
 let link=document.createElement('a');
 link.download='karya-smart-kids.png';
 link.href=paintCanvas.toDataURL('image/png');
 link.click();
 reward(5);
 alert('Karya berhasil disimpan! +5 XP 🎨');
 }

// UNDUH LAPORAN
function downloadReport(){
 let rows=[
  ['Tanggal','Mata Pelajaran','Nilai','Total Soal'],
  ...saved.history.map(h=>[h.date,h.subject,h.score,h.total])
 ];
 let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 let blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
 let url=URL.createObjectURL(blob);
 let a=document.createElement('a');
 a.href=url;
 a.download='laporan-smart-kids.csv';
 a.click();
 URL.revokeObjectURL(url);
}
