
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Kids Adventure</title>
<style>
:root{--purple:#7655df;--pink:#ff83b5;--blue:#5ca9f5;--yellow:#ffca55;--green:#50c99a;--bg:#f5f3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Trebuchet MS',Arial,sans-serif;color:#302b4b}
button{border:0;cursor:pointer;font:inherit}
header{background:linear-gradient(120deg,#7655df,#aa78ed);color:white;padding:22px 5%;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:900}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#ffffff25;padding:9px 13px;border-radius:14px;font-weight:bold}
main{max-width:1100px;margin:auto;padding:22px 16px 60px}
h1{font-size:27px;margin:12px 0 5px}
h2{font-size:21px}
p{line-height:1.6}
.hero{background:linear-gradient(120deg,#ffe4f0,#e9e2ff);padding:25px;border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.hero h1{color:#6847ca}
.hero .mascot{font-size:75px}
.section-title{margin:25px 0 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.card{background:white;border-radius:19px;padding:18px;box-shadow:0 5px 18px #4d397d10}
.subject{cursor:pointer;transition:.2s;border-bottom:5px solid var(--color)}
.subject:hover,.game:hover{transform:translateY(-3px)}
.emoji{font-size:38px}
.subject h3{margin:10px 0 5px}
.small{font-size:13px;color:#777}
.btn{background:var(--purple);color:white;padding:12px 18px;border-radius:13px;font-weight:bold;margin:4px}
.btn.secondary{background:#eee9ff;color:#6847ca}
.btn.green{background:var(--green)}
.btn.orange{background:#f6a83d}
.btn.red{background:#ed7185}
button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:white;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #4d397d10}
.back{background:#eee9ff;color:#6847ca;padding:10px 15px;border-radius:12px;font-weight:bold}
.option{display:block;width:100%;text-align:left;background:#f3f0ff;padding:15px;border-radius:13px;margin:9px 0;color:#302b4b}
.option:hover{background:#e5dcff}
.option.correct{background:#d7f8e9}
.option.wrong{background:#ffe0e5}
.progress{height:12px;background:#eee;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:var(--green);width:0%;transition:.3s}
.center{text-align:center}
.big{font-size:55px}
footer{text-align:center;color:#888;padding:20px;font-size:12px}
input{padding:12px;border:2px solid #e6e0f5;border-radius:12px;font:inherit;width:100%;margin:6px 0}
.memory{font-size:35px;background:#eee9ff;border-radius:14px;min-height:75px}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
canvas{max-width:100%;border:2px solid #ddd;border-radius:12px;touch-action:none}
@media(max-width:500px){.hero{padding:17px}.hero .mascot{font-size:53px}.hero h1{font-size:22px}.memory-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">🚀 SMART KIDS ADVENTURE</div>
  <div class="stats">
   <div class="stat">⭐ <span id="stars">0</span></div>
   <div class="stat">🪙 <span id="coins">0</span></div>
   <div class="stat">⚡ Lv. <span id="level">1</span></div>
  </div>
 </div>
</header>
<main id="app"></main>
<footer>🌈 SMART KIDS ADVENTURE · Belajar sambil bermain!</footer>

<script>
const subjects=[
 {id:'pancasila',name:'Pendidikan Pancasila',icon:'🇮🇩',color:'#ff8b8b',desc:'Belajar Pancasila dan sikap baik',
  lessons:['Mengenal lima sila Pancasila','Menghormati orang tua dan guru','Hidup rukun dengan teman','Menjaga kebersihan lingkungan'],
  questions:[
   ['Dasar negara Indonesia adalah ...',['Pancasila','Garuda','Bendera','Peta'],0],
   ['Lambang negara Indonesia adalah ...',['Harimau','Garuda Pancasila','Gajah','Merpati'],1],
   ['Sila pertama berbunyi ...',['Persatuan Indonesia','Keadilan sosial','Ketuhanan Yang Maha Esa','Kemanusiaan yang adil'],2],
   ['Kita harus menghormati ...',['Orang tua dan guru','Mainan saja','Diri sendiri saja','Hewan saja'],0],
   ['Warna bendera Indonesia adalah ...',['Biru putih','Merah putih','Merah kuning','Hijau putih'],1],
   ['Jika teman berbeda agama, kita harus ...',['Mengejek','Menjauhi','Menghormati','Memarahi'],2],
   ['Membuang sampah sebaiknya di ...',['Sungai','Jalan','Halaman','Tempat sampah'],3],
   ['Sila ketiga mengajarkan kita untuk ...',['Bersatu','Bertengkar','Malas','Boros'],0],
   ['Saat teman kesulitan, kita sebaiknya ...',['Mengejek','Membantu','Pergi','Diam saja'],1],
   ['Lambang sila pertama adalah ...',['Pohon beringin','Bintang','Rantai','Padi kapas'],1],
   ['Bermusyawarah berarti ...',['Bertengkar','Bermain','Berdiskusi bersama','Tidur'],2],
   ['Kita harus berkata ...',['Kasar','Jujur','Bohong','Keras'],1],
   ['Contoh hidup rukun adalah ...',['Bermain bersama','Berkelahi','Mengejek','Berebut'],0],
   ['Sila kelima dilambangkan dengan ...',['Bintang','Rantai','Kepala banteng','Padi dan kapas'],3],
   ['Saat upacara kita harus ...',['Bercanda','Tertib','Berlari','Tidur'],1]
  ]},
 {id:'seni',name:'Seni Budaya',icon:'🎨',color:'#b58af5',desc:'Mengenal warna, gambar, dan seni',
  lessons:['Mengenal warna dasar','Mengenal bentuk benda','Menggambar dan mewarnai','Mengenal alat musik'],
  questions:[
   ['Warna daun biasanya ...',['Merah','Hijau','Ungu','Biru'],1],
   ['Alat untuk menggambar adalah ...',['Sendok','Pensil','Piring','Sepatu'],1],
   ['Warna merah dicampur kuning menjadi ...',['Hijau','Ungu','Jingga','Biru'],2],
   ['Alat musik yang dipukul adalah ...',['Drum','Seruling','Gitar','Biola'],0],
   ['Bentuk roda adalah ...',['Segitiga','Persegi','Lingkaran','Persegi panjang'],2],
   ['Warna langit cerah biasanya ...',['Biru','Hitam','Cokelat','Merah'],0],
   ['Untuk mewarnai kita bisa memakai ...',['Krayon','Penggaris','Penghapus','Gunting'],0],
   ['Alat musik yang ditiup adalah ...',['Drum','Seruling','Gitar','Kendang'],1],
   ['Bentuk buku biasanya ...',['Bulat','Segitiga','Persegi panjang','Bintang'],2],
   ['Warna matahari pada gambar biasanya ...',['Kuning','Hitam','Ungu','Hijau'],0],
   ['Kegiatan membuat gambar disebut ...',['Menyanyi','Menggambar','Menari','Berlari'],1],
   ['Gitar dimainkan dengan cara ...',['Ditiup','Dipukul','Dipetik','Digesek'],2],
   ['Warna biru dicampur kuning menjadi ...',['Hijau','Merah','Ungu','Hitam'],0],
   ['Bahan untuk membuat kolase dapat berupa ...',['Daun kering','Air minum','Sabun','Bensin'],0],
   ['Kita harus menjaga alat seni agar ...',['Cepat rusak','Hilang','Awet','Kotor'],2]
  ]},
 {id:'matematika',name:'Matematika',icon:'🔢',color:'#63b9ed',desc:'Berhitung jadi menyenangkan',
  lessons:['Mengenal angka 1 sampai 20','Penjumlahan sederhana','Pengurangan sederhana','Mengenal bentuk dan ukuran'],
  questions:[
   ['2 + 3 = ...',['4','5','6','7'],1],
   ['5 + 4 = ...',['8','9','10','11'],1],
   ['10 - 3 = ...',['6','7','8','9'],1],
   ['Angka setelah 9 adalah ...',['8','10','11','12'],1],
   ['7 + 2 = ...',['8','9','10','11'],1],
   ['6 - 2 = ...',['3','4','5','6'],1],
   ['Angka sebelum 15 adalah ...',['13','14','16','17'],1],
   ['3 + 3 = ...',['5','6','7','8'],1],
   ['12 - 2 = ...',['8','9','10','11'],2],
   ['Bentuk yang memiliki 3 sisi adalah ...',['Lingkaran','Segitiga','Persegi','Oval'],1],
   ['4 + 5 = ...',['7','8','9','10'],2],
   ['Angka terbesar adalah ...',['5','8','3','2'],1],
   ['10 + 5 = ...',['13','14','15','16'],2],
   ['8 - 4 = ...',['2','3','4','5'],2],
   ['Satu lusin sama dengan ...',['10','11','12','15'],2]
  ]},
 {id:'btq',name:'BTQ',icon:'📖',color:'#56cba3',desc:'Belajar huruf hijaiyah',
  lessons:['Mengenal huruf hijaiyah','Mengenal harakat fathah','Mengenal harakat kasrah','Mengenal harakat dammah'],
  questions:[
   ['Huruf pertama hijaiyah adalah ...',['Ba','Alif','Ta','Jim'],1],
   ['Huruf ب dibaca ...',['Alif','Ba','Ta','Tsa'],1],
   ['Fathah berbunyi ...',['A','I','U','E'],0],
   ['Kasrah berbunyi ...',['A','I','U','O'],1],
   ['Dammah berbunyi ...',['A','I','U','E'],2],
   ['Huruf ت dibaca ...',['Ba','Ta','Jim','Dal'],1],
   ['Huruf ج dibaca ...',['Jim','Ha','Kha','Dal'],0],
   ['Huruf ا dibaca ...',['Ba','Alif','Nun','Mim'],1],
   ['Huruf م dibaca ...',['Nun','Lam','Mim','Wau'],2],
   ['Al-Qur’an adalah kitab suci umat ...',['Islam','Kristen','Hindu','Buddha'],0],
   ['Huruf ن dibaca ...',['Nun','Mim','Sin','Syin'],0],
   ['Tanda baca di atas huruf adalah ...',['Kasrah','Fathah','Dammah','Sukun'],1],
   ['Huruf ل dibaca ...',['Mim','Lam','Ra','Kaf'],1],
   ['Kita membaca Al-Qur’an dengan ...',['Sembarangan','Adab yang baik','Bercanda','Berlari'],1],
   ['Huruf و dibaca ...',['Wau','Ya','Alif','Ba'],0]
  ]},
 {id:'pjok',name:'PJOK',icon:'⚽',color:'#ffbd57',desc:'Tubuh sehat dan kuat',
  lessons:['Gerak dasar berjalan dan berlari','Mengenal permainan bola','Menjaga kebersihan tubuh','Pentingnya olahraga'],
  questions:[
   ['Sebelum olahraga sebaiknya ...',['Tidur','Pemanasan','Makan banyak','Duduk'],1],
   ['Kita mandi agar tubuh ...',['Kotor','Bersih','Lelah','Basah saja'],1],
   ['Olahraga membuat tubuh ...',['Sehat','Sakit','Lemah','Malas'],0],
   ['Bola ditendang menggunakan ...',['Tangan','Kaki','Kepala','Siku'],1],
   ['Saat haus kita harus minum ...',['Air','Minyak','Sabun','Cat'],0],
   ['Berjalan menggunakan ...',['Kaki','Telinga','Mata','Tangan saja'],0],
   ['Setelah olahraga kita sebaiknya ...',['Pendinginan','Langsung tidur','Berlari lagi terus','Tidak minum'],0],
   ['Kita menggosok gigi menggunakan ...',['Sisir','Sikat gigi','Sendok','Pensil'],1],
   ['Permainan sepak bola menggunakan ...',['Bola','Raket','Kelereng','Papan'],0],
   ['Agar sehat kita perlu makan ...',['Makanan bergizi','Permen saja','Keripik saja','Es saja'],0],
   ['Saat menyeberang jalan kita harus ...',['Berlari cepat','Berhati-hati','Bermain','Menutup mata'],1],
   ['Lompat menggunakan ...',['Kaki','Hidung','Telinga','Jari'],0],
   ['Kita mencuci tangan menggunakan ...',['Sabun dan air','Cat','Minyak','Pasir'],0],
   ['Tidur yang cukup membuat tubuh ...',['Segar','Lemas','Kotor','Sakit'],0],
   ['Saat bermain kita harus ...',['Curang','Sportif','Marah','Mengejek'],1]
  ]}
];

let data=JSON.parse(localStorage.getItem('smartKids')||'{}');
data.xp=data.xp||0;data.coins=data.coins||0;data.stars=data.stars||0;
data.study=data.study||0;data.play=data.play||0;
data.completed=data.completed||0;data.history=data.history||[];
let currentQuiz=[],qIndex=0,score=0,quizSubject=null;
let memoryCards=[],memoryOpen=[],memoryFound=0;
let mathAnswer=0,mathScore=0,mathRound=0;
let guessIndex=0,guessScore=0;
let timerStart=Date.now();

function save(){localStorage.setItem('smartKids',JSON.stringify(data));updateStats()}
function updateStats(){
 document.getElementById('stars').textContent=data.stars;
 document.getElementById('coins').textContent=data.coins;
 document.getElementById('level').textContent=Math.floor(data.xp/100)+1;
}
function addReward(points){
 data.xp+=points;data.coins+=Math.max(1,Math.floor(points/2));
 data.stars+=Math.max(1,Math.floor(points/10));save();
}
function home(){
 document.getElementById('app').innerHTML=`
 <section class="hero">
  <div><h1>Halo, Petualang Cilik! 🌈</h1>
  <p>Yuk belajar, bermain, dan kumpulkan bintang!</p>
  <button class="btn" onclick="showSubjects()">Mulai Belajar 🚀</button></div>
  <div class="mascot">🦊</div>
 </section>
 <div class="grid">
  <div class="card center">⭐<h2>${data.stars}</h2><div class="small">Total bintang</div></div>
  <div class="card center">⚡<h2>${data.xp}</h2><div class="small">Total XP</div></div>
  <div class="card center">🏆<h2>${data.completed}</h2><div class="small">Kuis selesai</div></div>
 </div>
 <h2 class="section-title">📚 Mata Pelajaran</h2>
 <div class="grid">${subjects.map(s=>`
 <div class="card subject" style="--color:${s.color}" onclick="openSubject('${s.id}')">
 <div class="emoji">${s.icon}</div><h3>${s.name}</h3><div class="small">${s.desc}</div>
 </div>`).join('')}</div>
 <h2 class="section-title">🎮 Taman Permainan</h2>
 <div class="grid">
  <div class="card game" onclick="memoryGame()"><div class="emoji">🧠</div><b>Game Memori</b><p class="small">Cari pasangan gambar!</p></div>
  <div class="card game" onclick="mathGame()"><div class="emoji">🔢</div><b>Game Hitung</b><p class="small">Asah kemampuan berhitung!</p></div>
  <div class="card game" onclick="guessGame()"><div class="emoji">🕵️</div><b>Tebak Gambar</b><p class="small">Tebak gambar yang muncul!</p></div>
  <div class="card game" onclick="colorGame()"><div class="emoji">🖍️</div><b>Mewarnai</b><p class="small">Berkreasi dengan warna!</p></div>
 </div>
 <div class="panel"><h2>👨‍👩‍👧 Dashboard Orang Tua</h2>
 <p>Progres belajar dan aktivitas anak.</p>
 <button class="btn secondary" onclick="parentDashboard()">Buka laporan</button></div>`;
 updateStats();
}
function showSubjects(){document.getElementById('app').scrollIntoView({behavior:'smooth'})}
function backButton(){return `<button class="back" onclick="home()">← Kembali ke Beranda</button>`}
function openSubject(id){
 let s=subjects.find(x=>x.id===id);
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel">
 <div class="center"><div class="big">${s.icon}</div><h1>${s.name}</h1><p>${s.desc}</p></div>
 <h2>📘 Materi Pembelajaran</h2>
 ${s.lessons.map((l,i)=>`<div class="card" style="margin:9px 0"><b>${i+1}. ${l}</b><p class="small">Pelajari materi ini dengan bantuan guru atau orang tua, lalu lanjutkan ke kuis.</p></div>`).join('')}
 <button class="btn green" onclick="startQuiz('${id}')">Mulai Kuis 📝</button>
 </div>`;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(id){
 quizSubject=subjects.find(s=>s.id===id);
 currentQuiz=shuffle(quizSubject.questions).slice(0,15);
 qIndex=0;score=0;showQuestion();
}
function showQuestion(){
 let q=currentQuiz[qIndex];
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel">
 <div class="top"><b>${quizSubject.icon} ${quizSubject.name}</b><b>Soal ${qIndex+1}/15</b></div>
 <div class="progress" style="margin:16px 0"><div style="width:${qIndex/15*100}%"></div></div>
 <h2>${q[0]}</h2>
 ${shuffle(q[1].map((v,i)=>({v,correct:i===q[2]}))).map((o)=>`
 <button class="option" onclick="answer(this,${o.correct})">${o.v}</button>`).join('')}
 <p class="small">Jawab dengan teliti ya! 🌟</p>
 </div>`;
}
function answer(button,correct){
 let opts=document.querySelectorAll('.option');
 opts.forEach(b=>b.disabled=true);
 if(correct){button.classList.add('correct');score++}
 else{button.classList.add('wrong')}
 setTimeout(()=>{
 qIndex++;
 if(qIndex<currentQuiz.length)showQuestion();else finishQuiz();
 },650);
}
function finishQuiz(){
 let points=score*5;
 addReward(points);data.completed++;
 data.study+=Math.max(1,Math.round(currentQuiz.length/3));
 data.history.unshift({name:quizSubject.name,score:score+'/'+currentQuiz.length,date:new Date().toLocaleDateString('id-ID')});
 data.history=data.history.slice(0,20);save();
 document.getElementById('app').innerHTML=`
 <div class="panel center">
 <div class="big">🏆</div><h1>Kuis Selesai!</h1>
 <h2>Nilai kamu: ${score}/${currentQuiz.length}</h2>
 <p>${score>=12?'Hebat sekali! Kamu luar biasa! 🌟':score>=8?'Bagus! Terus berlatih ya! 😊':'Jangan menyerah, ayo belajar lagi! 💪'}</p>
 <div class="grid"><div class="card">⭐<h2>+${Math.max(1,Math.floor(points/10))}</h2>Bintang</div><div class="card">⚡<h2>+${points}</h2>XP</div></div>
 <button class="btn" onclick="openSubject('${quizSubject.id}')">Ulangi Kuis</button>
 <button class="btn secondary" onclick="home()">Beranda</button>
 </div>`;
}
function memoryGame(){
 let emojis=['🐱','🐶','🦁','🐸','🐼','🦋','🍎','🌈'];
 memoryCards=shuffle([...emojis,...emojis]);memoryOpen=[];memoryFound=0;
 renderMemory();
}
function renderMemory(){
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel center"><h1>🧠 Game Memori</h1>
 <p>Cari dua gambar yang sama!</p>
 <h3>Pasangan ditemukan: ${memoryFound}/8</h3>
 <div class="memory-grid">${memoryCards.map((c,i)=>`
 <button class="memory" onclick="flipMemory(${i})">${c.open||c.found?c.emoji:'❔'}</button>`).join('')}</div>
 </div>`;
}
function flipMemory(i){
 let c=memoryCards[i];if(c.open||c.found||memoryOpen.length===2)return;
 c.open=true;c.emoji=memoryCards[i];memoryOpen.push(i);
 renderMemory();
 if(memoryOpen.length===2){
 let [a,b]=memoryOpen;
 if(memoryCards[a]===memoryCards[b]){memoryCards[a]={found:true,emoji:memoryCards[a]};memoryCards[b]={found:true,emoji:memoryCards[b]};memoryFound++;memoryOpen=[];setTimeout(()=>{
 if(memoryFound===8){addReward(30);data.play+=3;save();alert('Hebat! Semua pasangan ditemukan! +30 XP');home()}
 else renderMemory();
 },300)}
 else setTimeout(()=>{memoryCards[a]={};memoryCards[b]={};memoryOpen=[];renderMemory()},850);
 }
}
function mathGame(){mathScore=0;mathRound=0;nextMath()}
function nextMath(){
 if(mathRound>=10){addReward(mathScore*5);data.play+=2;save();document.getElementById('app').innerHTML=`<div class="panel center"><h1>🎉 Selesai!</h1><h2>Skor ${mathScore}/10</h2><button class="btn" onclick="home()">Beranda</button></div>`;return}
 let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;
 let minus=Math.random()>.5&&a>=b;
 mathAnswer=minus?a-b:a+b;
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel center"><div class="big">🔢</div>
 <h1>Game Berhitung</h1><p>Soal ${mathRound+1}/10 · Skor ${mathScore}</p>
 <h1>${a} ${minus?'-':'+'} ${b} = ?</h1>
 <div class="grid">${shuffle([mathAnswer,mathAnswer+1,Math.max(0,mathAnswer-1),mathAnswer+2]).map(n=>`<button class="btn secondary" onclick="checkMath(${n})">${n}</button>`).join('')}</div>
 </div>`;
}
function checkMath(n){if(n===mathAnswer)mathScore++;mathRound++;nextMath()}
const guesses=[['🐘','Gajah'],['🦋','Kupu-kupu'],['🍎','Apel'],['🐱','Kucing'],['🐟','Ikan'],['🌻','Bunga matahari'],['🚗','Mobil'],['🐸','Katak']];
function guessGame(){guessIndex=0;guessScore=0;showGuess()}
function showGuess(){
 if(guessIndex>=guesses.length){addReward(guessScore*5);data.play+=2;save();document.getElementById('app').innerHTML=`<div class="panel center"><h1>🎉 Selesai!</h1><h2>Benar ${guessScore}/${guesses.length}</h2><button class="btn" onclick="home()">Beranda</button></div>`;return}
 let g=guesses[guessIndex];
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel center"><h1>🕵️ Tebak Gambar</h1>
 <p>Gambar ${guessIndex+1}/${guesses.length}</p><div class="big">${g[0]}</div>
 <h2>Apakah nama gambar ini?</h2>
 ${shuffle([g[1],'Harimau','Pisang','Burung']).map(x=>`<button class="option" onclick="checkGuess('${x.replace(/'/g,"")}','${g[1]}')">${x}</button>`).join('')}
 </div>`;
}
function checkGuess(x,correct){if(x===correct)guessScore++;guessIndex++;showGuess()}
function colorGame(){
 document.getElementById('app').innerHTML=`
 ${backButton()}<div class="panel center"><h1>🖍️ Arena Mewarnai</h1>
 <p>Pilih warna, lalu sentuh gambar untuk mewarnai.</p>
 <div>${['#ff7777','#ffcf55','#65cb92','#6bb8f5','#b18af5','#ff91c5','#ffffff','#333333'].map(c=>`<button onclick="paintColor='${c}'" style="background:${c};width:35px;height:35px;border-radius:50%;border:2px solid #ddd;margin:4px"></button>`).join('')}</div>
 <canvas id="paint" width="320" height="260"></canvas>
 <p><button class="btn secondary" onclick="clearPaint()">Hapus warna</button></p>
 </div>`;
