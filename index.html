
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101015">
<title>Smart Kids Adventure</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:radial-gradient(ellipse at top,#482033,transparent 55%),#101015;
 color:white;font-family:Poppins,sans-serif;min-height:100vh
}
button{font:inherit;cursor:pointer}
#app{max-width:950px;margin:auto;padding:16px}
.hidden{display:none!important}
.login{min-height:92vh;display:flex;align-items:center;justify-content:center}
.login-box{
 width:100%;max-width:440px;text-align:center;padding:30px 22px;
 border:1px solid #743449;border-radius:23px;
 background:linear-gradient(145deg,#29202a,#17151c);
 box-shadow:0 20px 60px #0009
}
.symbols{display:flex;justify-content:center;gap:25px;margin:22px}
.symbols span{font:900 42px Orbitron;color:#ff315d;text-shadow:0 0 18px #ff315d}
.logo{font:clamp(40px,10vw,60px)/1 Anton;letter-spacing:2px}
.logo span{color:#ff315d}
.subtitle{font:10px Orbitron;letter-spacing:3px;color:#d9c4ce;margin-top:12px}
.divider{height:3px;width:90px;background:#ff315d;margin:22px auto}
.login-title{font:14px Orbitron;color:#ff315d}
.desc{font-size:12px;line-height:1.8;color:#b9aeb9;margin:12px 0 20px}
input{
 width:100%;padding:15px;background:#121117;border:1px solid #754052;
 border-radius:12px;color:white;outline:none
}
input:focus{border-color:#ff315d}
.main-btn{
 width:100%;padding:14px;margin-top:12px;border:1px solid #ff7894;
 border-radius:12px;color:white;
 background:linear-gradient(120deg,#fa315e,#a9113d);
 font:700 11px Orbitron;letter-spacing:1px
}
.error{color:#ff8299;font-size:11px;min-height:20px;margin-top:7px}
.creator{border-top:1px solid #44303a;margin-top:25px;padding-top:18px;color:#bbaab3;font-size:9px;letter-spacing:2px}
.creator b{display:block;color:white;margin-top:8px;font:11px Orbitron}
.topbar{
 display:flex;justify-content:space-between;align-items:center;
 padding:15px;background:#211d27;border:1px solid #563244;border-radius:15px
}
.topbar h2{font:24px Anton;letter-spacing:2px}
.topbar h2 span{color:#ff315d}
.status{font:9px Orbitron;color:#00dfa0;text-align:right;line-height:1.8}
.profile{
 display:flex;align-items:center;gap:12px;padding:13px;margin-top:13px;
 background:#211d27;border:1px solid #563244;border-radius:14px
}
.avatar{font-size:27px;background:#8f193a;border-radius:12px;padding:9px}
.profile-info{flex:1;min-width:0}
.profile-info small{font:9px Orbitron;color:#ff829b}
.profile-info b{display:block;overflow-wrap:anywhere}
.small-btn{padding:9px;border:1px solid #754052;border-radius:9px;background:#30222c;color:white;font-size:10px}
.hero{
 padding:24px 19px;margin-top:14px;
 background:linear-gradient(120deg,#491b30,#211923);
 border:1px solid #74364b;border-radius:18px
}
.hero small{font:9px Orbitron;color:#ff91a8;letter-spacing:2px}
.hero h1{font:34px Anton;margin:10px 0;overflow-wrap:anywhere}
.hero p{font-size:12px;line-height:1.8;color:#d5c3cc}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{padding:13px 5px;text-align:center;background:#211d27;border:1px solid #49303d;border-radius:13px}
.stat strong{display:block;color:#00dfa0;font:19px Orbitron}
.stat span{font-size:10px;color:#b9aeb9}
.section-title{font:23px Anton;letter-spacing:2px;margin:25px 0 12px}
.progress-card{padding:16px;background:#211d27;border:1px solid #49303d;border-radius:14px;margin-top:13px}
.progress-head{display:flex;justify-content:space-between;font-size:10px}
.progress-head b{font:10px Orbitron;color:#ff315d}
.track{height:8px;background:#39303b;border-radius:20px;margin-top:10px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#b9163d,#ff5279)}
.mission{
 padding:16px;background:#211d27;border:1px solid #49303d;
 border-radius:14px;margin-top:13px
}
.mission b{font:10px Orbitron;color:#ff6685}
.mission p{font-size:11px;color:#b9aeb9;margin-top:7px;line-height:1.7}
footer{text-align:center;padding:27px 8px;color:#aa9ca7;font-size:9px;letter-spacing:1px}
footer b{display:block;margin-top:8px;color:white;font:10px Orbitron}
@media(max-width:370px){
 #app{padding:11px}
 .hero h1{font-size:29px}
}
</style>
</head>

<body>
<div id="app">

<section class="login" id="loginPage">
 <div class="login-box">
  <div style="font:9px Orbitron;color:#ff91a8;letter-spacing:3px">WELCOME TO THE GAME</div>
  <div class="symbols"><span>○</span><span>△</span><span>□</span></div>
  <div class="logo">SMART <span>KIDS</span><br>ADVENTURE</div>
  <div class="subtitle">THE LEARNING GAME</div>
  <div class="divider"></div>

  <div class="login-title">PLAYER IDENTIFICATION</div>
  <p class="desc">Masukkan nama pemain untuk membuka arena belajar.</p>

  <form id="loginForm">
   <input id="playerName" maxlength="25" placeholder="Masukkan nama kamu..." required>
   <div class="error" id="loginError"></div>
   <button class="main-btn">ENTER THE GAME →</button>
  </form>

  <div class="creator">
   WEBSITE CREATED BY
   <b>MOH NATHAN ALMUSTAF</b>
  </div>
 </div>
</section>

<section id="homePage" class="hidden">
 <div id="dashboard"></div>
</section>

</div>

<script>
let player=localStorage.getItem("ska_player")||"";
let data;

try{
 data=JSON.parse(localStorage.getItem("ska_data")||"{}");
}catch(e){
 data={};
}

data.xp=data.xp||0;
data.coins=data.coins||0;
data.completed=data.completed||[];
data.lessonDone=data.lessonDone||[];

function saveData(){
 localStorage.setItem("ska_data",JSON.stringify(data));
}

function safe(text){
 return String(text).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function greeting(){
 if(player.toLowerCase()==="azkara"){
  return "Halo boy kamu adalah owner semangat ujian nya ya";
 }
 if(player.toLowerCase()==="haura"){
  return "Halo cantik ini cuman uji coba tugas maaf kalo gari dan membosan kan yaaa love youuu";
 }
 return "Selamat datang di arena belajar. Siap menyelesaikan misi?";
}

function showDashboard(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("homePage").classList.remove("hidden");

 const level=Math.floor(data.xp/100)+1;
 const progress=data.xp%100;

 document.getElementById("dashboard").innerHTML=`
  <div class="topbar">
   <h2>SMART <span>KIDS</span></h2>
   <div class="status">PLAYER STATUS<br>ACTIVE ●</div>
  </div>

  <div class="profile">
   <div class="avatar">🎭</div>
   <div class="profile-info">
    <small>PLAYER PROFILE</small>
    <b>${safe(player.toUpperCase())}</b>
   </div>
   <button class="small-btn" onclick="changePlayer()">GANTI</button>
  </div>

  <div class="hero">
   <small>WELCOME TO THE ARENA</small>
   <h1>HALO, ${safe(player.toUpperCase())}!</h1>
   <p>${safe(greeting())}</p>
  </div>

  <div class="stats">
   <div class="stat"><strong>${data.xp}</strong><span>XP</span></div>
   <div class="stat"><strong>${data.coins}</strong><span>KOIN</span></div>
   <div class="stat"><strong>${level}</strong><span>LEVEL</span></div>
  </div>

  <div class="progress-card">
   <div class="progress-head">
    <span>LEVEL PROGRESS</span>
    <b>${progress}/100 XP</b>
   </div>
   <div class="track">
    <div class="fill" style="width:${progress}%"></div>
   </div>
  </div>

  <h2 class="section-title">○ MISSION CONTROL</h2>

  <div class="mission">
   <b>01 · LEARNING ARENA</b>
   <p>Tempat belajar lima mata pelajaran kelas 3 SD.</p>
  </div>

  <div class="mission">
   <b>02 · QUIZ CHALLENGE</b>
   <p>Uji kemampuanmu melalui tantangan soal.</p>
  </div>

  <div class="mission">
   <b>03 · MINI GAMES</b>
   <p>Permainan seru untuk melatih kemampuan berpikir.</p>
  </div>

  <footer>
   SMART KIDS ADVENTURE
   <b>CREATED BY MOH NATHAN ALMUSTAF</b>
  </footer>
 `;
}

function changePlayer(){
 localStorage.removeItem("ska_player");
 player="";
 document.getElementById("homePage").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("playerName").value="";
}

document.getElementById("loginForm").addEventListener("submit",function(e){
 e.preventDefault();

 const name=document.getElementById("playerName").value.trim();

 if(!name){
  document.getElementById("loginError").textContent="Nama wajib diisi.";
  return;
 }

 player=name;
 localStorage.setItem("ska_player",player);
 showDashboard();
});

if(player){
 showDashboard();
}else{
 document.getElementById("loginPage").classList.remove("hidden");
}
</script>

</body>
</html>
