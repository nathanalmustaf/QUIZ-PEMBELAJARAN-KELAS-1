
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Adventure</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:#100b10;
 color:white;
 font-family:'Poppins',sans-serif;
 min-height:100vh;
}

.hidden{
 display:none!important;
}

#loginPage{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:22px;
 background:
 radial-gradient(circle at 50% 20%,#542033 0%,transparent 42%),
 linear-gradient(145deg,#100b10,#1b0c15 65%,#090709);
}

.login-card{
 width:100%;
 max-width:390px;
 padding:30px 23px;
 text-align:center;
 background:rgba(32,20,29,.94);
 border:1px solid #71334d;
 border-radius:22px;
 box-shadow:0 0 35px #a91d4633;
}

.symbols{
 display:flex;
 justify-content:center;
 gap:22px;
 margin-bottom:22px;
}

.symbol{
 width:43px;
 height:43px;
 border:3px solid #f02d70;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#f02d70;
 font-size:25px;
 font-weight:bold;
}

.circle{
 border-radius:50%;
}

.triangle{
 clip-path:polygon(50% 0,0 100%,100% 100%);
 background:#f02d70;
 border:0;
 color:#1b0c15;
 padding-top:12px;
}

.square{
 border-radius:3px;
}

.logo-small{
 color:#f02d70;
 font:12px Orbitron;
 letter-spacing:4px;
 margin-bottom:10px;
}

h1{
 font:38px Anton;
 letter-spacing:2px;
 line-height:1.1;
}

h1 span{
 color:#f02d70;
}

.subtitle{
 color:#bbaab5;
 font-size:11px;
 letter-spacing:2px;
 margin-top:12px;
}

.divider{
 height:1px;
 background:linear-gradient(90deg,transparent,#8e3656,transparent);
 margin:24px 0;
}

.login-title{
 font:18px Orbitron;
 color:#fff;
 margin-bottom:8px;
}

.login-desc{
 color:#bbaab5;
 font-size:11px;
 margin-bottom:22px;
}

input{
 width:100%;
 padding:15px;
 border:1px solid #704056;
 border-radius:10px;
 outline:none;
 background:#130e14;
 color:white;
 font:13px Poppins;
 text-align:center;
}

input:focus{
 border-color:#f02d70;
 box-shadow:0 0 12px #f02d7044;
}

.main-btn{
 width:100%;
 margin-top:15px;
 padding:15px;
 border:0;
 border-radius:10px;
 background:linear-gradient(100deg,#a91d46,#ed286c);
 color:white;
 font:700 12px Orbitron;
 letter-spacing:2px;
 cursor:pointer;
}

.main-btn:active{
 transform:scale(.98);
}

.warning{
 color:#ff6d9e;
 font-size:10px;
 margin-top:12px;
}

.footer-login{
 color:#8e7c88;
 font-size:9px;
 letter-spacing:2px;
 margin-top:25px;
 line-height:2;
}

.footer-login b{
 color:#f02d70;
 display:block;
 font-size:10px;
}

#homePage{
 display:none;
 min-height:100vh;
 padding:20px;
}

#dashboard{
 max-width:600px;
 margin:auto;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
}

.topbar h2{
 font:20px Anton;
 letter-spacing:2px;
}

.topbar h2 span{
 color:#f02d70;
}

.status{
 color:#00dfa0;
 font:9px Orbitron;
 text-align:right;
 line-height:1.8;
}

.profile{
 display:flex;
 align-items:center;
 gap:12px;
 padding:15px;
 background:#211d27;
 border:1px solid #563244;
 border-radius:13px;
 margin-top:12px;
}

.avatar{
 font-size:27px;
}

.profile-info{
 flex:1;
}

.profile-info small{
 display:block;
 color:#a99aa5;
 font-size:9px;
}

.profile-info b{
 font-size:13px;
}

footer{
 text-align:center;
 color:#8e7c88;
 font-size:9px;
 letter-spacing:2px;
 padding:25px 0;
 line-height:2;
}

footer b{
 display:block;
 color:#f02d70;
}
</style>
</head>

<body>

<section id="loginPage">
 <div class="login-card">

  <div class="symbols">
   <div class="symbol circle">○</div>
   <div class="symbol triangle">△</div>
   <div class="symbol square">□</div>
  </div>

  <div class="logo-small">WELCOME TO THE ARENA</div>

  <h1>SMART <span>KIDS</span><br>ADVENTURE</h1>

  <p class="subtitle">LEARN · PLAY · LEVEL UP</p>

  <div class="divider"></div>

  <div class="login-title">PLAYER LOGIN</div>
  <p class="login-desc">
   Masukkan nama pemain untuk memasuki arena belajar.
  </p>

  <input
   type="text"
   id="playerName"
   placeholder="MASUKKAN NAMA KAMU"
   maxlength="25"
  >

  <button class="main-btn" id="loginButton">
   ENTER THE ARENA
  </button>

  <p class="warning" id="loginWarning"></p>

  <div class="footer-login">
   EDUCATIONAL GAME FOR GRADE 3
   <b>CREATED BY MOH NATHAN ALMUSTAF</b>
  </div>

 </div>
</section>

<section id="homePage">
 <div id="dashboard"></div>
</section>

<script>
/* JAVASCRIPT AKAN DITAMBAHKAN PADA TAHAP 2 */
</script>

</body>
</html>
