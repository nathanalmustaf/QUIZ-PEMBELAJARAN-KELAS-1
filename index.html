<script>
let player = "";
let data = JSON.parse(localStorage.getItem("ska_data")) || {
 xp: 0,
 coins: 0,
 lessonDone: []
};

function saveData(){
 localStorage.setItem("ska_data",JSON.stringify(data));
}

function safe(text){
 return String(text).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function greeting(){
 const name=player.toLowerCase();

 if(name==="haura"){
  return "Halo cantik ini cuman uji coba tugas maaf kalo gari dan membosan kan yaaa love youuu";
 }

 if(name==="azkara"){
  return "Halo boy kamu adalah owner semangat ujian nya ya";
 }

 return "Selamat datang di Smart Kids Adventure! Siap belajar dan bermain hari ini?";
}

function playSound(){
 if(!("speechSynthesis" in window)) return;

 const name=player.toLowerCase();

 if(name!=="haura" && name!=="azkara") return;

 const message=greeting();

 const voices=window.speechSynthesis.getVoices();
 const indo=voices.filter(v=>v.lang.toLowerCase().includes("id"));

 let voice=null;

 if(name==="haura"){
  voice=indo.find(v=>/female|woman|perempuan/i.test(v.name));
 }else{
  voice=indo.find(v=>/male|man|laki/i.test(v.name));
 }

 if(!voice) voice=indo[0] || voices[0];

 // Efek elektronik pembuka
 try{
  const AudioCtx=window.AudioContext || window.webkitAudioContext;
  if(AudioCtx){
   const ctx=new AudioCtx();
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();

   osc.type="sine";
   osc.frequency.setValueAtTime(660,ctx.currentTime);
   osc.frequency.exponentialRampToValueAtTime(330,ctx.currentTime+0.35);

   gain.gain.setValueAtTime(0.12,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);

   osc.connect(gain);
   gain.connect(ctx.destination);

   osc.start();
   osc.stop(ctx.currentTime+0.4);
  }
 }catch(e){}

 const utterance=new SpeechSynthesisUtterance(message);
 utterance.lang="id-ID";
 utterance.rate=name==="haura"?0.9:0.82;
 utterance.pitch=name==="haura"?1.15:0.75;
 utterance.volume=1;

 if(voice) utterance.voice=voice;

 setTimeout(()=>{
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
 },450);
}

function login(){
 const input=document.getElementById("playerName");
 const warning=document.getElementById("loginWarning");

 player=input.value.trim();

 if(!player){
  warning.textContent="MASUKKAN NAMA PEMAIN TERLEBIH DAHULU!";
  return;
 }

 localStorage.setItem("ska_player",player);

 playSound();
 showDashboard();
}

    <small>PLAYER PROFILE</small>
    <b>${safe(player.toUpperCase())}</b>

  <div class="navbar">
   <button class="nav-btn ${tab==="home"?"active":""}" onclick="renderTab('home')">⌂ BERANDA</button>
   <button class="nav-btn ${tab==="mission"?"active":""}" onclick="renderTab('mission')">△ MISI</button>

  ${content}

  <footer>

   <b>CREATED BY MOH NATHAN ALMUSTAF</b>

 `;

function shuffleQuestions(list){
 const result=[...list];

 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }

 return result;
}

let quizLastAnswerCorrect=false;

function answerQuiz(choice){
 if(quizAnswered || quizFinished) return;

 quizAnswered=true;

 const q=quizQuestions[quizIndex];

 if(choice===q.answer){
  quizCorrect++;
  quizLastAnswerCorrect=true;

  data.coins+=2;
  saveData();

  quizWrong++;
  quizLastAnswerCorrect=false;
  quizLastWrongLesson=q.lesson;
 }

 if(quizWrong>=6 || quizIndex===14){
  quizFinished=true;
 }

 renderQuiz();
}

  </div>

   <button class="nav-btn" onclick="renderTab('learn')">📚 BELAJAR</button>
   <button class="nav-btn" onclick="renderTab('quiz')">🎯 QUIZ</button>
   <button class="nav-btn active">🏆 REWARD</button>
   <button class="nav-btn" onclick="renderTab('profile')">□ PROFIL</button>
  </div>

     <h3>${data.xp}</h3>

    </div>
    <div class="panel">

    </div>

     <p>BADGE</p>
    </div>

     style="width:${progress}%"></div>

      <div class="achievement-icon">${a.icon}</div>
      <b>${a.name}</b>
      <small>${a.unlocked()?"✓ TERBUKA":"🔒 TERKUNCI"}</small>
      <small>${a.description}</small>
     </div>
    `).join("")}
   </div>
  </div>

  <footer>
   SMART KIDS ADVENTURE
   <b>CREATED BY MOH NATHAN ALMUSTAF</b>

function addAchievementNavigation(){
 const navbar=document.querySelector(".navbar");
 if(!navbar || navbar.innerHTML.includes("renderTab('achievements')")) return;

 const button=document.createElement("button");
 button.className="nav-btn";
 button.innerHTML="🏆 REWARD";
 button.onclick=()=>renderTab("achievements");
 navbar.appendChild(button);
}

renderTab=function(tab){
 if(tab==="achievements"){
  renderAchievements();
  return;
 }

 stage4RenderTab(tab);
 addAchievementNavigation();
};
</script>
